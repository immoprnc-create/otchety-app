name: Build macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-universal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license 2>/dev/null || true

      - name: Install Python universal2 from python.org
        run: |
          curl -L -o /tmp/python.pkg "https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /

      - name: Install dependencies (x86_64 mode)
        run: arch -x86_64 /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 -m pip install customtkinter pandas openpyxl tkcalendar matplotlib pyinstaller

      - name: Build x86_64 app
        run: arch -x86_64 /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 -m PyInstaller --windowed --collect-all customtkinter --collect-all tkcalendar --collect-all matplotlib --name "Otchety" report_builder.py

      - name: Rename and zip
        run: |
          cd dist
          mv Otchety.app "Отчёты.app"
          zip -r "$GITHUB_WORKSPACE/Otchety-Universal.zip" "Отчёты.app"

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "Otchety-Universal.zip"
          tag: latest
          name: "Otchety - last version"
          body: |
            **Otchety-Universal.zip** — works on all Macs (Intel and M1/M2/M3)

            After downloading: unzip -> right-click Отчёты.app -> Open
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}