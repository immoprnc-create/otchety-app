name: Build macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-universal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install customtkinter pandas openpyxl tkcalendar matplotlib pyinstaller

      - name: Build universal app
        run: python -m PyInstaller --windowed --target-arch universal2 --collect-all customtkinter --collect-all tkcalendar --collect-all matplotlib --name "Otchety" report_builder.py

      - name: Rename and zip
        run: |
          cd dist
          mv Otchety.app "Отчёты.app"
          zip -r "$GITHUB_WORKSPACE/Otchety-Universal.zip" "Отчёты.app"

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "Otchety-Universal.zip"
          tag: latest
          name: "Otchety - last version"
          body: |
            **Otchety-Universal.zip** — works on all Macs (Intel and M1/M2/M3)

            After downloading: unzip -> right-click Отчёты.app -> Open
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}