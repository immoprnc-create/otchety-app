name: Build macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apple-silicon:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install customtkinter pandas openpyxl tkcalendar matplotlib pyinstaller

      - name: Build app
        run: python -m PyInstaller --windowed --collect-all customtkinter --collect-all tkcalendar --collect-all matplotlib --name "Otchety" report_builder.py

      - name: Rename and zip
        run: |
          cd dist
          mv Otchety.app "Отчёты.app"
          zip -r "$GITHUB_WORKSPACE/Otchety-AppleSilicon.zip" "Отчёты.app"

      - uses: actions/upload-artifact@v4
        with:
          name: apple-silicon
          path: Otchety-AppleSilicon.zip

  build-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install customtkinter pandas openpyxl tkcalendar matplotlib pyinstaller

      - name: Build app
        run: python -m PyInstaller --windowed --collect-all customtkinter --collect-all tkcalendar --collect-all matplotlib --name "Otchety" report_builder.py

      - name: Rename and zip
        run: |
          cd dist
          mv Otchety.app "Отчёты.app"
          zip -r "$GITHUB_WORKSPACE/Otchety-Intel.zip" "Отчёты.app"

      - uses: actions/upload-artifact@v4
        with:
          name: intel
          path: Otchety-Intel.zip

  release:
    needs: [build-apple-silicon, build-intel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apple-silicon

      - uses: actions/download-artifact@v4
        with:
          name: intel

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "*.zip"
          tag: latest
          name: "Otchety - last version"
          body: |
            Download the right file:
            - **Otchety-AppleSilicon.zip** - Mac M1/M2/M3
            - **Otchety-Intel.zip** - Mac Intel (2019 and older)

            After downloading: unzip -> right-click Отчёты.app -> Open
          allowUpdates: true
          removeArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}